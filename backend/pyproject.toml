[project]
name = "sehat-bridge-backend"
version = "0.1.0"
description = "Sehat Bridge API — multi-tenant platform for Indonesian faskes"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "boto3>=1.35.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "pyjwt>=2.9.0",
    "pwdlib[argon2]>=0.2.1",
    "email-validator>=2.2.0",
    "aioboto3>=13.2.0",
    "cryptography>=43.0.0",
    "prometheus-client>=0.26.0",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101", "B008"]  # B008: FastAPI dependency defaults are idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"app/config.py" = ["S105"]
"app/users/router.py" = ["S608"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires postgres, redis, and minio (docker compose up)",
]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["redis.*", "asyncpg.*", "boto3.*", "botocore.*", "aioboto3.*"]
ignore_missing_imports = true
