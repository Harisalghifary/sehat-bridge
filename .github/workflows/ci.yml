name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sehat
          POSTGRES_PASSWORD: sehat
          POSTGRES_DB: sehat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sehat"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://sehat_app:sehat_app@localhost:5432/sehat
      MIGRATION_DATABASE_URL: postgresql+asyncpg://sehat:sehat@localhost:5432/sehat
      REDIS_DSN: redis://localhost:6379/0
      APP_DB_ROLE: sehat_app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run python scripts/check_tenant_safety.py
      - run: uv run pytest -q
      - name: OpenAPI contract diff
        run: |
          uv run python scripts/generate_api_docs.py
          git diff --exit-code docs/api.md
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=sehat \
            -e MINIO_ROOT_PASSWORD=sehat-secret \
            -e MINIO_API_CORS_ALLOW_ORIGIN=http://localhost:8080 \
            --tmpfs /data:rw,mode=1777 \
            cgr.dev/chainguard/minio:latest@sha256:0a01100085e30fb08d2f39e39c9f5c9d83a95707f220b007d813b690cd41622d \
            server /data
      - name: Bootstrap bucket
        run: uv run python -m app.init_storage
      - name: Start mock SATUSEHAT
        working-directory: .
        run: |
          docker build -t mock-satusehat tools/mock-satusehat
          docker run -d --name mock-satusehat -p 8090:8090 mock-satusehat
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8090/health && break
            sleep 2
          done
          curl -fsS http://localhost:8090/health
      - run: uv run pytest -q -m integration

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          API_BASE_URL: http://backend:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:8080

  compose:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet